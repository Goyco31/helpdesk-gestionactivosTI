# Compila el backend (Spring Boot) y lo publica en Azure App Service.
# Se ejecuta al subir cambios del backend a la rama de trabajo, o a mano desde la pestaña Actions.
# Requiere en GitHub (Settings > Secrets and variables > Actions):
#   - Secret   AZURE_WEBAPP_PUBLISH_PROFILE : perfil de publicacion descargado del App Service
#   - Variable AZURE_WEBAPP_NAME            : nombre del App Service (ej. helpdesk-api-goyco)
name: Backend - Azure App Service

on:
  push:
    branches: [creacion-del-frontend-con-el-backend, main]
    paths: ['backend/**', '.github/workflows/backend-azure.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-azure
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compilar (sin pruebas que requieran la BD)
        run: mvn -B clean package -DskipTests

      - name: Preparar el JAR
        run: |
          mkdir -p ../deploy
          cp "$(ls target/*.jar | grep -v original | head -n 1)" ../deploy/app.jar
          ls -lh ../deploy

      - name: Publicar en Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: deploy/app.jar
