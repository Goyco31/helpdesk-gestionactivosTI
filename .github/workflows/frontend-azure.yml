# Compila el Front-End (React + Vite) y lo publica en Azure Static Web Apps.
# Requiere en GitHub (Settings > Secrets and variables > Actions):
#   - Secret   AZURE_STATIC_WEB_APPS_API_TOKEN : token de despliegue del Static Web App
#   - Variable VITE_API_URL                    : URL publica del backend (https://<app>.azurewebsites.net)
name: Frontend - Azure Static Web Apps

on:
  push:
    branches: [creacion-del-frontend-con-el-backend, main]
    paths: ['Frontend/**', '.github/workflows/frontend-azure.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-azure
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Compilar (la URL del backend queda dentro del build)
        working-directory: Frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          test -n "$VITE_API_URL" || { echo "Falta la variable VITE_API_URL en GitHub"; exit 1; }
          npm ci
          npm run build

      - name: Publicar en Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: Frontend/dist
          skip_app_build: true
