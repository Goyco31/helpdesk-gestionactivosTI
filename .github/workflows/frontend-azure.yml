# Compila el Front-End (React + Vite) y lo publica en un App Service Linux (Node)
# que comparte el plan B1 del backend (sin costo adicional).
# Requiere en GitHub (Settings > Secrets and variables > Actions):
#   - Secret   AZURE_FRONTEND_PUBLISH_PROFILE : perfil de publicacion del App Service del Front
#   - Variable AZURE_FRONTEND_APP_NAME        : nombre del App Service del Front (ej. helpdesk-web-goyco31)
#   - Variable VITE_API_URL                   : URL publica del backend (https://<api>.azurewebsites.net)
name: Frontend - Azure App Service

on:
  push:
    branches: [creacion-del-frontend-con-el-backend, main]
    paths: ['Frontend/**', '.github/workflows/frontend-azure.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-azure
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Compilar (la URL del backend queda dentro del build)
        working-directory: Frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          test -n "$VITE_API_URL" || { echo "Falta la variable VITE_API_URL en GitHub"; exit 1; }
          npm ci
          npm run build

      - name: Publicar en Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_FRONTEND_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_FRONTEND_PUBLISH_PROFILE }}
          package: Frontend/dist
