spring.application.name=backend

# ---------------------------------------------------------------
# Las credenciales NO se escriben aqui. Se leen de variables de
# entorno o, en desarrollo local, del archivo backend/.env
# (copia .env.example como .env y completa tus valores).
# El archivo .env esta en .gitignore y nunca se sube a GitHub.
# ---------------------------------------------------------------
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

# Conexion a PostgreSQL en Azure
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Configuracion de Hibernate/JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${SHOW_SQL:false}

# Correo electronico (Gmail con contrasena de aplicacion)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Seguridad
# Clave de firma del JWT en Base64 (minimo 32 bytes). Generala con:  openssl rand -base64 48
jwt.secret=${JWT_SECRET}
# Duracion del token en minutos (por defecto 8 horas)
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}
# Origenes autorizados para CORS, separados por coma (sin espacios)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Carpeta donde se guardan las actas PDF: <ACTAS_DIR>/Actas 2026/10 - Octubre/...
app.actas.directorio=${ACTAS_DIR:./Actas}
